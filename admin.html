<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitLife | Admin</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><div id="nav"></div><main class="container py-5"><div id="adminLogin"><div class="auth-box mx-auto" style="max-width:480px"><span class="eyebrow">ADMIN PANEL</span><h2 class="fw-bold mt-2">FitLife Store Admin</h2><form id="adminLoginForm"><label>Email</label><input id="adminEmail" type="email" class="form-control mb-3" required><label>Password</label><input id="adminPass" type="password" class="form-control mb-3" required><button class="btn btn-brand w-100">Open Admin</button><p class="small text-secondary mt-3">Demo: admin@fitlife.com / admin123</p></form></div></div>
<div id="adminContent" class="d-none"><div class="d-flex justify-content-between align-items-center mb-4"><div><span class="eyebrow">CONTROL CENTER</span><h1 class="fw-bold">Admin Dashboard</h1></div><button id="adminLogout" class="btn btn-outline-danger">Logout</button></div>
<div class="row g-3 mb-4"><div class="col-md-3"><div class="stat-card"><i class="bi bi-people"></i><b id="aUsers">0</b><small>Users</small></div></div><div class="col-md-3"><div class="stat-card"><i class="bi bi-eye"></i><b id="aVisitors">0</b><small>Visits</small></div></div><div class="col-md-3"><div class="stat-card"><i class="bi bi-bag-check"></i><b id="aOrders">0</b><small>Orders</small></div></div><div class="col-md-3"><div class="stat-card"><i class="bi bi-currency-rupee"></i><b id="aSales">₹0</b><small>Demo Sales</small></div></div></div>
<div class="row g-4"><div class="col-lg-5"><div class="panel-card"><div class="panel-title"><h4>Add Product</h4></div><form id="productForm"><input id="prName" class="form-control mb-2" placeholder="Product name" required><input id="prCategory" class="form-control mb-2" placeholder="Category" required><input id="prPrice" type="number" class="form-control mb-2" placeholder="Price ₹" required><input id="prImage" class="form-control mb-2" placeholder="Emoji or image URL" value="💪"><textarea id="prDesc" class="form-control mb-2" placeholder="Short description"></textarea><button class="btn btn-brand w-100">Add Product</button></form></div></div>
<div class="col-lg-7"><div class="panel-card"><div class="panel-title"><h4>Products</h4></div><div id="adminProducts"></div></div></div>
<div class="col-12"><div class="panel-card"><div class="panel-title"><h4>Customer Orders</h4></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Order</th><th>User</th><th>Total</th><th>Status</th><th>Change</th></tr></thead><tbody id="adminOrders"></tbody></table></div></div></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="app.js"></script></body></html>
