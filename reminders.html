<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitLife | Reminders</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><div id="nav"></div><main class="container py-5"><div class="section-heading text-start"><span>SMART REMINDERS</span><h1>Meals, water & workouts</h1><p>Browser notifications work when permission is granted and this website is open.</p></div>
<div class="panel-card"><div class="d-flex gap-2 flex-wrap mb-4"><button id="notificationBtn" class="btn btn-brand"><i class="bi bi-bell"></i> Enable Notifications</button><button id="testNotification" class="btn btn-outline-brand">Test Notification</button></div>
<form id="reminderForm" class="row g-3"><div class="col-md-4"><label>Reminder Type</label><select id="rType" class="form-select"><option value="Meal">🍽 Meal</option><option value="Water">💧 Water</option><option value="Workout">🏋️ Workout</option><option value="Sleep">😴 Sleep</option></select></div><div class="col-md-3"><label>Time</label><input id="rTime" type="time" class="form-control" required></div><div class="col-md-5"><label>Message</label><input id="rMessage" class="form-control" placeholder="e.g. Drink water"></div><div class="col-12"><button class="btn btn-brand">Add Reminder</button></div></form><div id="reminderList" class="mt-4"></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="app.js"></script></body></html>
