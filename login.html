<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FitLife | Account</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body class="auth-page"><div id="nav"></div>
<main class="container py-5"><div class="auth-shell">
<div class="auth-intro"><span class="badge-soft">FITLIFE ACCOUNT</span><h1 class="fw-bold mt-3">Your fitness journey, saved.</h1><p>Register once, then your plans, progress, reminders and orders stay available on this browser.</p><div class="auth-points"><p>✓ Personalized plans</p><p>✓ Weight & measurement history</p><p>✓ Workout & order tracking</p></div></div>
<div class="auth-box">
<ul class="nav nav-pills mb-4" id="authTabs"><li class="nav-item flex-fill"><button class="nav-link active w-100" data-bs-toggle="pill" data-bs-target="#loginPane">Login</button></li><li class="nav-item flex-fill"><button class="nav-link w-100" data-bs-toggle="pill" data-bs-target="#registerPane">Register</button></li></ul>
<div class="tab-content">
<div class="tab-pane fade show active" id="loginPane"><form id="loginForm">
<label>Email</label><input id="loginEmail" type="email" class="form-control mb-3" required>
<label>Password</label><input id="loginPassword" type="password" class="form-control mb-3" required>
<button class="btn btn-brand w-100">Login to FitLife</button><p class="small text-secondary mt-3">Demo admin: admin@fitlife.com / admin123</p></form></div>
<div class="tab-pane fade" id="registerPane"><form id="registerForm">
<label>Full Name</label><input id="regName" class="form-control mb-3" required>
<label>Email</label><input id="regEmail" type="email" class="form-control mb-3" required>
<label>Password</label><input id="regPassword" type="password" minlength="6" class="form-control mb-3" required>
<label>Confirm Password</label><input id="regConfirm" type="password" minlength="6" class="form-control mb-3" required>
<button class="btn btn-brand w-100">Create Account</button></form></div>
</div></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="app.js"></script></body></html>
